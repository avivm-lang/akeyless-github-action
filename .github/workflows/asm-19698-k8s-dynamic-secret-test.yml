name: ASM-19698 AWS Dynamic Secret Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Fetch AWS dynamic secret
        id: fetch-secret
        uses: akeyless-community/akeyless-github-action@ASM-19698-upgrade-akeyless-sdk
        with:
          access-id: ${{ vars.AKEYLESS_ACCESS_ID }}
          access-type: jwt
          api-url: https://api.staging.akeyless.dev
          dynamic-secrets: |
            - name: "/AWS/aws-ds"
              output-name: "AWS_SECRET"
            - name: "/AWS/aws-ds"
              output-name: "AWS_ACCESS_KEY"
              key: "access_key_id"

      - name: Verify output is not broken
        env:
          AWS_SECRET: ${{ steps.fetch-secret.outputs.AWS_SECRET }}
          AWS_ACCESS_KEY: ${{ steps.fetch-secret.outputs.AWS_ACCESS_KEY }}
        run: |
          set -euo pipefail

          echo "Raw output length: ${#AWS_SECRET}"

          if echo "$AWS_SECRET" | grep -qi '\[object Object\]'; then
            echo "FAIL: output contains [object Object]"
            exit 1
          fi

          echo "$AWS_SECRET" | jq -e '.access_key_id | startswith("AKIA")' >/dev/null

          if [ -z "$AWS_ACCESS_KEY" ]; then
            echo "FAIL: key=access_key_id extraction returned empty value"
            exit 1
          fi

          echo "PASS: AWS dynamic secret serialized correctly"
