name: ASM-19698 K8s Dynamic Secret Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Kubernetes dynamic secret
        id: fetch-secret
        uses: uses: avivm-lang/akeyless-github-action@ASM-19698-upgrade-akeyless-sdk
        with:
          access-id: ${{ vars.AKEYLESS_ACCESS_ID }}
          access-type: jwt
          api-url: ${{ vars.AKEYLESS_API_URL || 'https://api.akeyless.io' }}
          dynamic-secrets: |
            - name: "/AWS/aws-ds"
              output-name: "KUBERNETES_SECRET"
            - name: "/AWS/aws-ds"
              output-name: "K8S_TOKEN"
              key: "token"

      - name: Verify nested fields are not broken
        env:
          KUBERNETES_SECRET: ${{ steps.fetch-secret.outputs.KUBERNETES_SECRET }}
          K8S_TOKEN: ${{ steps.fetch-secret.outputs.K8S_TOKEN }}
        run: |
          set -euo pipefail

          echo "Raw output length: ${#KUBERNETES_SECRET}"

          if echo "$KUBERNETES_SECRET" | grep -qi '\[object Object\]'; then
            echo "FAIL: output contains [object Object]"
            exit 1
          fi

          # Full JSON output should contain a token field
          echo "$KUBERNETES_SECRET" | jq -e '.token | length > 0' >/dev/null

          # key extraction should return a plain string token
          if [ -z "$K8S_TOKEN" ]; then
            echo "FAIL: key=token extraction returned empty value"
            exit 1
          fi

          echo "PASS: Kubernetes dynamic secret serialized correctly"
