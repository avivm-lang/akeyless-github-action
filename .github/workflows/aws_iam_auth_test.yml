name: Auth AWS IAM to Akeyless Test

on:
  workflow_dispatch:

jobs:
  test_aws_iam:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (pulls cloud-id from package.json git ref)
        run: |
          rm -f package-lock.json
          npm install

      - name: Rebuild action dist with that cloud-id
        run: npm run package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Akeyless Auth via AWS IAM
        uses: ./
        with:
          access-id: ${{ secrets.AKEYLESS_AWS_ACCESS_ID }}
          access-type: aws_iam
          api-url: "https://api.akeyless.io"
          static-secrets: |
            - name: "/aws-cloud-id-test"
              output-name: "my_secret"
